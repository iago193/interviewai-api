version: '3.8'

services:
  postgres:
    image: postgres:16
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: 12345
      POSTGRES_DB: interviewai
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: